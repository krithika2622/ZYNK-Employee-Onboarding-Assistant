
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZYNK Employee Onboarding Assistant Login">
  <title>ZYNK | Employee Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <main class="login-page">
    <section class="login-card">

      <div class="brand">
        <div class="brand-icon">Z</div>
        <span>ZYNK</span>
      </div>

      <p class="welcome-label">EMPLOYEE PORTAL</p>
      <h1>Welcome back!</h1>
      <p class="subtitle">Sign in to continue your onboarding journey.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Employee Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="6"
              required
            >
            <button type="button" id="togglePassword" class="show-btn">
              Show
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <p id="errorMessage" class="error-message" aria-live="polite"></p>

        <button type="submit" class="login-btn">Sign In</button>
      </form>

      <p class="demo-note">
        Sample prototype: Use any valid email and a password with at least 6 characters.
      </p>

      <p class="footer-text">
        © 2026 ZYNK · Employee Onboarding Assistant
      </p>

    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
